
services:
  app:
    image: ${APP_IMAGE:-pc-konfigurator:local}
    build: ./app                      
    ports:
      - "8000:8000"
    environment:
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      LLM_MODEL: ${LLM_MODEL:-gemma3:4b}
      EMBED_MODEL: ${EMBED_MODEL:-bge-m3}
      DATA_DIR: /data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/data                 

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    volumes:
      - ollama:/root/.ollama

volumes:
  ollama:
