# RAG nad PDF dokumentmi a ontológiou PC konfigurátora
# Spustenie: docker compose up  ->  http://localhost:8000
# Hotový image z GitHubu: nastavte APP_IMAGE v súbore .env a spustite docker compose pull
services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama          # stiahnuté modely ostanú aj po reštarte

  app:
    image: ${APP_IMAGE:-pc-rag:local}
    build: ./app                      # ak image nie je stiahnutý, postaví sa lokálne
    ports:
      - "8000:8000"
    environment:
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      LLM_MODEL: ${LLM_MODEL:-gemma3:4b}
      EMBED_MODEL: ${EMBED_MODEL:-bge-m3}
      DATA_DIR: /data
    extra_hosts:
      - "host.docker.internal:host-gateway"   # pre Ollamu nainštalovanú priamo v počítači
    volumes:
      - ./data:/data                  # sem patria PDF a ontológia
    depends_on:
      - ollama

volumes:
  ollama:
