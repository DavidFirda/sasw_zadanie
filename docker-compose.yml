# PC konfigurátor: 3D konfigurátor nad ontológiou a poradca (RAG) nad PDF a ontológiou
# Spustenie: docker compose up  ->  http://localhost:8000
# Predvolene sa server pripája na Ollamu nainštalovanú priamo v počítači.
# Ollama v Dockeri: docker compose --profile ollama up  (a v .env OLLAMA_URL=http://ollama:11434)
services:
  app:
    image: ${APP_IMAGE:-pc-konfigurator:local}
    build: ./app                      # ak image nie je stiahnutý, postaví sa lokálne
    ports:
      - "8000:8000"
    environment:
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      LLM_MODEL: ${LLM_MODEL:-gemma3:4b}
      EMBED_MODEL: ${EMBED_MODEL:-bge-m3}
      DATA_DIR: /data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/data                  # PDF, ontológie a index poradcu

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    volumes:
      - ollama:/root/.ollama

volumes:
  ollama:
