<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Konfigurátor – PC konfigurátor</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/app.css">
</head>
<body data-strana="konfigurator">
<main class="obal">
<div class="konf-hlavicka">
  <h1>Konfigurátor</h1>
  <div class="vyber"><label for="preset" class="jemny maly">Začať od</label><select id="preset"></select></div>
</div>
<div class="konf">
  <section aria-label="Náhľad počítača">
    <div class="pohlad-prep"><span class="jemny" id="pohladInfo"></span>
      <div class="prepinac" role="group" aria-label="Zobrazenie"><button type="button" data-mode="3d" aria-pressed="true">3D</button><button type="button" data-mode="2d" aria-pressed="false">Bokorys s kótami</button></div></div>
    <div class="scena" id="host3d"><canvas id="c3d" aria-label="3D model zostavy"></canvas><div class="ovl3d" id="ovl3d"></div><div class="tip3d" id="tip3d" hidden></div>
      <div class="nastroje3d" id="tools3d"><button type="button" data-t="spin" aria-pressed="true">Otáčanie</button><button type="button" data-t="glass" aria-pressed="true">Sklo</button><button type="button" data-t="rgb">RGB: <span></span></button><button type="button" data-t="view">Pohľad: <span></span></button></div></div>
    <div class="svg2d" id="svgHost" hidden></div>
    <div class="merace" id="merace"></div>
  </section>
  <aside class="panel" aria-label="Výber dielov">
    <div class="kategorie" role="tablist" id="kategorie"></div>
    <div class="moznosti-hlav"><h2 id="katNazov"></h2><label class="prepinac-maly"><input type="checkbox" id="lenKomp"> len kompatibilné</label></div>
    <div class="moznosti" id="moznosti"></div>
    <details class="kontroly-box" id="kontrolyBox"><summary id="kontrolySum">Kontrola kompatibility</summary><ul class="kontroly" id="kontroly"></ul></details>
  </aside>
</div>
</main>
<div class="suhrn" aria-label="Súhrn zostavy"><div class="obal">
  <span class="cenovka"><b id="spolu">0 €</b></span>
  <div class="stav" id="stav"></div>
  <div class="tl"><button class="btn btn-1" type="button" id="btnPoradca">Opýtať sa poradcu na zostavu</button></div>
</div></div>
<script src="vendor/three.min.js"></script>
<script src="js/core.js"></script>
<script src="js/chat.js"></script>
<script src="js/render2d.js"></script>
<script src="js/render3d.js"></script>
<script src="js/konfigurator.js"></script>
</body>
</html>
