<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poradca – PC konfigurátor</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/app.css">
</head>
<body data-strana="poradca">
<main class="obal">
  <div class="uvod"><div>
    <h1>Poradca</h1>
    <p>Odpovedá len z PDF dokumentov a ontológie zo Zadania 1. Pri každej odpovedi ukáže úryvky, z ktorých vychádzal. Na otázky mimo týchto zdrojov má povedať, že odpoveď nepozná.</p>
  </div></div>
  <div class="poradca">
    <aside class="zdroje-panel" aria-label="Zdroje poradcu">
      <h2>Čo poradca pozná</h2>
      <ul class="modely" id="modely"></ul>
      <div id="zdroje"><p class="jemny maly">Načítavam stav…</p></div>
      <button class="btn btn-2 btn-s" type="button" id="reindex">Načítať zdroje znova</button>
      <p class="maly jemny">PDF pridáte do priečinka <code>data/pdf</code>, potom kliknite na tlačidlo vyššie.</p>
    </aside>
    <section class="chat" id="chat" aria-label="Rozhovor s poradcom">
      <div class="konverzacia" aria-live="polite">
        <div class="uvodny" id="otazky"></div>
      </div>
      <form class="vstup">
        <label for="otazka" class="sr">Otázka</label>
        <textarea id="otazka" rows="1" placeholder="Napíšte otázku…"></textarea>
        <button class="btn btn-1" type="submit">Opýtať sa</button>
      </form>
    </section>
  </div>
</main>
<script src="js/core.js"></script>
<script src="js/chat.js"></script>
<script src="js/poradca.js"></script>
</body>
</html>
