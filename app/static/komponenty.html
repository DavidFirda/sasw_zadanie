<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Komponenty – PC konfigurátor</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/app.css">
</head>
<body data-strana="komponenty">
<main class="obal">
  <div class="uvod"><div>
    <h1>Komponenty</h1>
    <p>Všetky diely z ontológie s parametrami, z ktorých sa počíta kompatibilita. Pri dieloch je odkaz na zdroj údajov.</p>
  </div></div>
  <div class="karty" role="tablist" id="karty"></div>
  <div class="filtre"><label class="sr" for="hladat">Hľadať</label><input type="search" id="hladat" placeholder="Hľadať podľa názvu"><label class="sr" for="vyrobca">Výrobca</label><select id="vyrobca"></select></div>
  <div class="tabulka-obal"><table class="tabulka"><thead><tr><th>Produkt</th><th>Parametre</th><th style="text-align:right">Cena</th><th><span class="sr">Akcia</span></th></tr></thead><tbody id="riadky"></tbody></table></div>
</main>
<script src="js/core.js"></script>
<script src="js/render2d.js"></script>
<script src="js/komponenty.js"></script>
</body>
</html>
